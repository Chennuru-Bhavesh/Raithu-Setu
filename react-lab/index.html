<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RaithuSetu React Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef7f0; margin: 0; color: #1d2b22; }
    .container { max-width: 1100px; margin: 24px auto; padding: 20px; }
    .badge { background: #d8f3dc; color: #1b4332; padding: 6px 10px; border-radius: 999px; font-weight: bold; }
    .panel { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); margin-bottom: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .col { flex: 1 1 220px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #c7d8cf; width: 100%; box-sizing: border-box; }
    button { background: #2d6a4f; color: white; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #dfeee4; padding: 10px; text-align: left; }
    .error { color: #a61b1b; font-weight: bold; }
    .success { color: #245c36; font-weight: bold; }
    .small { font-size: 12px; color: #51655b; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="app.js"></script>
</body>
</html>
